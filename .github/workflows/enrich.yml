name: Enrichment Pipeline

on:
  schedule:
    # Executa 3x ao dia: 06:00, 12:00 e 17:00 (UTC-3)
    # Isso equivale a 09:00, 15:00 e 20:00 no UTC
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Enrich Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: go run cmd/enrich/main.go
